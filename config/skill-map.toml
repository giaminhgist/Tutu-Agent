# Tutu skill map — single source of truth for which skills each agent preloads
# (`skills:` frontmatter) and which it may borrow through the Skill tool.
# Names are fully qualified `<plugin>:<skill>`; tests/test_skill_map.py checks
# that agent files match this map and that every skill exists in the installed plugins.

[orchestrator]
model = "claude-opus-5-5"
preload = [
  "superpowers:brainstorming",
  "superpowers:writing-plans",
  "superpowers:dispatching-parallel-agents",
  "superpowers:verification-before-completion",
  "aris:research-pipeline",
  "supervisor-skills:vibe-research-workflow",
]
borrow = ["aris:render-html", "superpowers:executing-plans", "aris:research-refine-pipeline", "aris:research-wiki"]

[research]
model = "claude-sonnet-5-5"
preload = [
  "supervisor-skills:deep-research",
  "aris:research-lit",
  "aris:arxiv",
  "aris:semantic-scholar",
  "aris:alphaxiv",
  "aris:research-wiki",
]
borrow = ["aris:openalex", "aris:deepxiv", "aris:wiki-enrich", "aris:exa-search", "aris:keenable-search", "aris:novelty-check"]

